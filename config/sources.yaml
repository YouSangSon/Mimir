# Toggle individual sources, and the global gray-source policy.
gray_enabled: true        # set false to disable scraping-based (GRAY) sources like pykrx
disabled_ids: []          # e.g. ["dart"] to turn one off (this is the way to disable a source)
lang: en                  # report/digest/status UI language: en | ko | zh
llm_sentiment_enabled: false      # paid LLM news-sentiment signal. Default off; needs ANTHROPIC_API_KEY + the [llm] extra.
llm_sentiment_max_headlines: 50   # per-run cap on newly classified headlines (cost guardrail)

# Analysis-plane settings. `sources:` decides what gets collected; this block
# decides how collected data is interpreted by signals. Omit this block to keep
# analysis defaults.
#
# analysis:
#   news:
#     # Built-in aliases for the default watchlist are enabled by default.
#     # Set false if a broad company name causes false positives in your feeds.
#     use_default_aliases: true
#     # Optional company-name aliases used by news_volume and opt-in llm_sentiment.
#     # User aliases are added to the built-in defaults and deduped per symbol.
#     # RSS still stores only official title/summary metadata; aliases only affect
#     # how stored news is matched to watchlist symbols during analysis.
#     aliases:
#       AAPL: ["Apple", "Apple Inc."]
#       MSFT: ["Microsoft", "Microsoft Corp."]
#       NVDA: ["NVIDIA", "Nvidia Corporation"]
#       "005930": ["Samsung Electronics", "삼성전자"]
#   macro_regime:
#     # Macro series allowed to influence the market-wide rate-regime signal.
#     # CPI-like series can be collected without being treated as policy/benchmark rates.
#     rate_series: ["DGS10", "FEDFUNDS", "722Y001.0101000"]

# (Optional) Per-source configuration. Omit a block to keep that source's built-in
# default. Add series/feeds here to extend coverage WITHOUT editing Python.
# A malformed block (wrong type, typo'd key) fails fast — it never silently falls back.
#
# sources:
#   fred:
#     # FRED series IDs (https://fred.stlouisfed.org). Default: [DGS10, FEDFUNDS, CPIAUCSL]
#     series: ["DGS10", "FEDFUNDS", "CPIAUCSL", "T10Y2Y", "UNRATE"]
#   ecos:
#     # Bank of Korea ECOS series. Default: BOK base rate (722Y001 / 0101000).
#     series:
#       - { stat_code: "722Y001", cycle: "M", item_code: "0101000" }   # base rate
#   rss:
#     # Official, headline/metadata-only feeds. Default: SEC press releases.
#     feeds:
#       - { url: "https://www.sec.gov/news/pressreleases.rss", publisher: "SEC", market: "US" }
