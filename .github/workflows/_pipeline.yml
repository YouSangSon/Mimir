name: _pipeline
# Reusable pipeline: collect -> analyze -> history -> evaluate -> deliver -> dashboard,
# then commit data + reports.
# Called by the thin collect-{hourly,daily,weekly,monthly}.yml schedulers.
on:
  workflow_call:
    inputs:
      cadence:
        description: hourly | daily | weekly | monthly
        required: true
        type: string

concurrency:
  group: collect
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -e "."
      - name: Run pipeline
        env:
          CADENCE: ${{ inputs.cadence }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          MIMIR_SEC_USER_AGENT: ${{ secrets.MIMIR_SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mimir.run --cadence "$CADENCE"
      - name: Run dashboard
        run: python -m mimir.dashboard --data-root data --reports-root reports
      - name: Commit data + reports
        env:
          CADENCE: ${{ inputs.cadence }}
        run: |
          git config user.name "mimir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git commit -m "data: $CADENCE $(date -u +%FT%TZ)" || exit 0
          git pull --rebase
          git push
