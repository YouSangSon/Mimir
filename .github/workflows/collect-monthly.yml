name: collect-monthly
on:
  schedule:
    - cron: "43 22 1 * *"   # 1st of month 22:43 UTC (off-peak minute; cron is best-effort)
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e "."
      - name: Collect
        env:
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          MIMIR_SEC_USER_AGENT: ${{ secrets.MIMIR_SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mimir.collect --cadence monthly
      - name: Analyze & deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m mimir.analyze
          python -m mimir.deliver --cadence monthly
      - name: Commit data
        run: |
          git config user.name "mimir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git commit -m "data: monthly $(date -u +%FT%TZ)" || exit 0
          git pull --rebase
          git push
