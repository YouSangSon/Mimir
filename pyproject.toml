[project]
name = "mimir"
version = "0.1.0"
description = "Free, legal investment-insight data collector"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mimir = "mimir.cli:main"
"mimir.collect" = "mimir.collect:main"
"mimir.backfill" = "mimir.backfill:main"
"mimir.analyze" = "mimir.analyze:main"
"mimir.deliver" = "mimir.deliver:main"
"mimir.history" = "mimir.history:main"
"mimir.doctor" = "mimir.doctor.doctor_cli:main"
"mimir.evaluate" = "mimir.evaluate:main"
"mimir.dashboard" = "mimir.dashboard:main"
"mimir.run" = "mimir.run:main"

[project.optional-dependencies]
# KR prices via pykrx (GRAY: scraping). Pulls pandas. Install with: pip install -e ".[kr]"
kr = [
    "pykrx>=1.0.45",
]
# Off-by-default LLM news-sentiment signal (INC5). Paid Anthropic API calls; the
# default classifier imports this lazily so core install + tests never need it.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.2",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "coverage>=7.5",
    "types-requests",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mimir*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["integration: hits real network; deselected by default"]
addopts = "-m 'not integration'"
